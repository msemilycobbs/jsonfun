<!DOCTYPE html>

<html>
  <head>


  </head>
   <body>
  <h1>test</h1>

<div id="sites"></div>

<script>
async function loadJSON() {
  const response = await fetch("sites.json");
  const sites = await response.json();

  let output = "";

  sites.forEach(site => {
    output += `<a href="${site.url}"><b>${site.name}<b></a><br>`;
    
  });

  document.getElementById("sites").innerHTML = output;
}

loadJSON();
</script>
  </body>
</html>
