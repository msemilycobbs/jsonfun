<!DOCTYPE html>

<html>
  <head>


  </head>
   <body>
  <h1>test</h1>

<div id="customers"></div>

<script>
fetch("customer.json")
  .then(response => response.json())
  .then(customers => {
    let output = "";

    customers.forEach(customer => {
      output += `${customer.name} | ${customer.city} | ${customer.job}<br>`;
    });

    document.getElementById("customers").innerHTML = output;
  });
</script>
  </body>
</html>
